
name: build

on:
  push:
    branches: [ main ]
    tags: ["*"]
  repository_dispatch: {}



jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.3
      - name: sphinx build
        run: pixi run sphinx-build -M html . _build --keep-going
      - uses: actions/upload-pages-artifact@v4
        with: 
          path: _build/html


  deploy:
    needs: build
    
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      pages: write    
      id-token: write 
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
                  
     
